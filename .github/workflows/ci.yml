name: OCR checks

on:
  push:
    branches: [main, feature/ocr-review-image-reader]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build English OCR environment
        run: docker build -t insurance-document-orc:pilot .
      - name: Run unit tests
        run: docker run --rm -v "$PWD:/work" insurance-document-orc:pilot python -m unittest discover -s tests -v
      - name: Verify recorded benchmark fingerprints
        run: docker run --rm -v "$PWD:/work" insurance-document-orc:pilot python build_review.py
      - name: Check browser JavaScript syntax
        run: |
          node --check review_ui.js
          node --check image_reader.js
      - name: Test Review Desk suggestion interactions
        run: node tests/test_review_suggestions_ui.cjs
      - name: Test reader package interactions
        run: node tests/test_reader_package_ui.cjs
      - name: Build Thai OCR environment
        run: docker build -f Dockerfile.thai -t insurance-ocr-reader:thai .
      - name: Verify English and Thai language packs
        run: |
          docker run --rm -v "$PWD:/work" insurance-ocr-reader:thai python -c "from image_reader import available_languages; languages=available_languages(); print(languages); assert {'eng', 'tha'} <= set(languages)"

  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install analysis and browser dependencies
        run: |
          python -m pip install -r requirements.txt ruff==0.17.1 playwright==1.64.0
          python -m playwright install --with-deps chromium
      - name: Lint only non-frozen analytical code
        run: make lint
      - name: Build clean checkout OCR environment
        run: docker build -t insurance-document-orc:pilot .
      - name: Verify frozen evidence and both test suites
        run: |
          docker run --rm -v "$PWD:/work" insurance-document-orc:pilot make verify-frozen
          docker run --rm -v "$PWD:/work" insurance-document-orc:pilot make test
      - name: Follow README one-command pipeline
        run: docker run --rm -v "$PWD:/work" insurance-document-orc:pilot make pipeline
      - name: Capture actual Review Desk
        run: python scripts/capture_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-analytics-and-review-desk
          path: |
            output/analytics/
            artifacts/review-desk.png
