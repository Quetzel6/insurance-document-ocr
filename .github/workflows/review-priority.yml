name: OCR review-priority supplement
on:
  push:
    paths: ['supplements/review_priority/**', '.github/workflows/review-priority.yml']
  pull_request:
    paths: ['supplements/review_priority/**', '.github/workflows/review-priority.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: supplements/review_priority
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install local OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          python -m pip install Pillow==12.3.0
      - name: Run protocol and metric unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce real OCR using the inspected synthetic cohort
        run: python experiment.py run --dataset dataset --out ci_reproduction
      - name: Evaluate earlier frozen policy on new font/layout cohort
        run: python challenge_eval.py run --dataset challenge_font_dataset --out ci_font_challenge
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-review-priority-reproduction
          path: |
            supplements/review_priority/ci_reproduction/
            supplements/review_priority/ci_font_challenge/
